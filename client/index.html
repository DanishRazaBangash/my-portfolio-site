    <!--
      Inter variable (300–900 in one file), self-hosted so the LCP text paint
      never waits on a third-party host. @font-face lives in index.css.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Pre-paint background to prevent flash on load */
      html { background: #e8e8ec; }
      html.dark { background: #030303; }
    </style>
    <!-- Apply saved theme before first paint to prevent colour flash -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('portfolio-theme') || '{}')
        var theme = (t.state && t.state.theme) || 'dark'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>

    <!--
      BotForge widget — injected after `load` so a third-party script on a cold
      Render dyno can never sit on the critical path and drag down LCP/INP.
    -->
    <script>
      window.addEventListener('load', function () {
        var s = document.createElement('script')
        s.src = 'https://chatbot-builder-widget.onrender.com/widget.min.js'
        s.async = true
        s.onload = function () {
          if (!window.ChatbotWidget) return
          window.ChatbotWidget.init({
            chatbotId: '6a3cf7fbd73f94a70d6cb848',
            apiUrl: 'https://chatbot-builder-api-2v3u.onrender.com/api/v1',
            name: 'Danish Raza Bangash',
            primaryColor: '#000000',
            position: 'bottom-right',
            greeting: 'Hi! Ask me about Danish Raza Bangash?',
            placeholder: 'Type your message...',
            showTimestamp: true,
          })
        }
        document.body.appendChild(s)
      })
    </script>
